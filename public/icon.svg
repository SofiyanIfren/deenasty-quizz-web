<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary Islamic Emerald Green Gradient -->
    <linearGradient id="primaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4a04" />
      <stop offset="45%" stop-color="#187206" />
      <stop offset="100%" stop-color="#115305" />
    </linearGradient>

    <!-- Light Warm Gold / Parchment Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8df" />
      <stop offset="50%" stop-color="#ebdda0" />
      <stop offset="100%" stop-color="#d4c37e" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#primaryBg)" />

  <!-- Subtle Islamic Geometric Rosette Frame -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#ebdda0" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ebdda0" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Main Brand Symbol -->
  <g filter="url(#glow)">
    <!-- Elegant Crescent Moon in Warm Gold -->
    <path d="M 285 135 C 225 140 180 190 180 250 C 180 316 232 368 298 368 C 332 368 362 354 382 332 C 342 344 288 332 262 300 C 236 266 242 208 274 172 C 286 158 298 148 314 142 C 304 138 295 135 285 135 Z" fill="url(#goldLight)"/>

    <!-- Open Book / Wisdom & Knowledge Icon -->
    <path d="M 180 348 C 214 332 244 332 256 342 C 268 332 298 332 332 348 C 332 348 326 264 256 254 C 186 264 180 348 180 348 Z" fill="#ffffff" fill-opacity="0.96"/>
    <path d="M 256 258 L 256 342" stroke="#187206" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Eight-Pointed Star (Rub el Hizb) -->
    <g transform="translate(328, 172) scale(0.9)">
      <rect x="-24" y="-24" width="48" height="48" rx="5" fill="url(#goldLight)"/>
      <rect x="-24" y="-24" width="48" height="48" rx="5" fill="url(#goldLight)" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="9" fill="#187206"/>
      <circle cx="0" cy="0" r="4.5" fill="#ebdda0"/>
    </g>
  </g>

  <!-- Accent stars & light dots -->
  <circle cx="158" cy="184" r="3.5" fill="#ebdda0" opacity="0.85"/>
  <circle cx="362" cy="275" r="3" fill="#ebdda0" opacity="0.75"/>
  <circle cx="192" cy="216" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>
